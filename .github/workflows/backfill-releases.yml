name: Backfill releases

# Manual, run once. Creates a tag and GitHub Release for every earlier version in the README
# that has a matching commit. Versions that already have a release are skipped.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose (shows exactly what GitHub says)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- who am I allowed to be"; gh api repos/${{ github.repository }} --jq '.permissions'
          echo "--- list releases"; gh api repos/${{ github.repository }}/releases --jq 'length'
          echo "--- create tag ref"; gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/v3.18.3 -f sha=a6236fcbfab028fdf32b4b34f3cfa16570341574 --jq .ref || true
          echo "--- create release on the main branch"; gh api -X POST repos/${{ github.repository }}/releases -f tag_name=v3.18.3 -f name=v3.18.3 -f body=test -F make_latest=false --jq .html_url || true
      - name: Create the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backfill_releases.py
