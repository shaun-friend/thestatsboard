name: Backfill releases

# Manual, run once. Creates a tag and GitHub Release for every earlier version in the README
# that has a matching commit. Versions that already have a release are skipped.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose (shows exactly what GitHub says)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          echo "--- release on the main branch (string flag)"; gh api -X POST repos/$R/releases -f tag_name=diag-test -f target_commitish=main -f name=diag-test -f body=test -f make_latest=false --jq .html_url || true
          echo "--- release on the first commit"; gh api -X POST repos/$R/releases -f tag_name=diag-test2 -f target_commitish=a6236fcbfab028fdf32b4b34f3cfa16570341574 -f name=diag-test2 -f body=test -f make_latest=false --jq .html_url || true
          echo "--- tag ref at an old commit"; gh api -X POST repos/$R/git/refs -f ref=refs/tags/diag-test3 -f sha=7a8e316$(git rev-parse 7a8e316 | cut -c8-) --jq .ref || true
          for t in diag-test diag-test2; do gh release delete $t --cleanup-tag -y 2>/dev/null || true; done
          gh api -X DELETE repos/$R/git/refs/tags/diag-test3 2>/dev/null || true
      - name: Create the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backfill_releases.py
