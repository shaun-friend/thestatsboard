name: Test and deploy

# Every push and pull request runs the full test suite.
# A push to the `dev` branch that passes is then uploaded to the DEV site automatically.
# PROD is never automatic: use the "Deploy to PROD" workflow (Actions tab, Run workflow).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser for the screen tests
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run every test
        env:
          SKIP_DATE_CHECK: "1"   # the build date is checked against today only when building a release by hand
        run: |
          cd tests
          ZIP=$(grep -m1 -E '^v[0-9][^ ]* +\|' ../site/README.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          bash build_release.sh "$ZIP"

  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload to the DEV site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT_DEV }}
        run: |
          test -n "$PROJECT" || { echo "Set the repository variable CF_PROJECT_DEV"; exit 1; }
          mkdir bundle && cp site/_worker.js site/README.txt site/index.html bundle/
          npx --yes wrangler@3 pages deploy bundle --project-name="$PROJECT" --branch=main --commit-dirty=true
