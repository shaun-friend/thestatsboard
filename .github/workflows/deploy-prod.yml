name: Deploy to PROD

# Manual only. Runs the tests on the `main` branch, uploads that exact version to the live site,
# then tags that commit (for example v3.39.7) and publishes a GitHub Release with the README notes and the zip.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROD to confirm you want to update the live site'
        required: true

permissions:
  contents: write   # needed to tag the release after a successful upload

jobs:
  deploy:
    if: github.event.inputs.confirm == 'PROD'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install browser for the screen tests
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run every test
        env:
          SKIP_DATE_CHECK: "1"
        run: |
          cd tests
          ZIP=$(grep -m1 -E '^v[0-9][^ ]* +\|' ../site/README.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          bash build_release.sh "$ZIP"
      - name: Upload to the live site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT_PROD }}
        run: |
          test -n "$PROJECT" || { echo "Set the repository variable CF_PROJECT_PROD"; exit 1; }
          mkdir bundle && cp site/_worker.js site/README.txt site/index.html bundle/
          npx --yes wrangler@4 pages deploy bundle --project-name="$PROJECT" --branch=main --commit-dirty=true
      - name: Tag and publish the GitHub Release
        continue-on-error: true   # the site is already live; a release problem must not show the deploy as failed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}   # personal access token: the built-in token cannot create tags here
        run: |
          V=$(grep -m1 -oE 'const VERSION = "[^"]+"' site/_worker.js | cut -d'"' -f2)
          ZIP=$(grep -m1 -E '^v[0-9][^ ]* +\|' site/README.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          python3 - "$V" > notes.md <<'PY'
          import sys,re
          v=sys.argv[1]; out=[]; on=False
          for line in open("site/README.txt",encoding="utf-8"):
              if line.startswith(v+" - "): on=True; continue
              if on and re.match(r"^v[0-9]\S* - ",line): break
              if on: out.append(line)
          print("".join(out).strip() or "See README.txt for the notes on this version.")
          PY
          if gh release view "$V" >/dev/null 2>&1; then echo "Release $V already exists"; exit 0; fi
          gh release create "$V" "dist/$ZIP" --target "$(git rev-parse HEAD)" --title "$V" --notes-file notes.md
